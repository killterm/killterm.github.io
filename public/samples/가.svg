<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>가 — 폰트 만들기 SVG 불러오기 예시</title>
  <desc>
    둥근 획 끝을 3차 베지어로 그린 한글 음절. 불러오면 2차 베지어로 근사되어
    글리프 윤곽선이 됩니다. 초성 ㄱ은 한 컨투어, 중성 ㅏ는 겹치는 두 컨투어입니다.
  </desc>
  <g fill="#111111">
    <!-- 초성 ㄱ — 가로획에서 세로획으로 이어지는 모서리를 곡선으로 -->
    <path d="M 120 170
             H 430
             C 480 170 510 200 510 250
             V 640
             C 510 690 485 715 445 715
             C 405 715 385 690 385 640
             V 265
             H 120
             C 80 265 60 245 60 215
             C 60 185 80 170 120 170
             Z" />
    <!-- 중성 ㅏ — 세로획과 곁줄기가 겹친다 (겹침은 합집합으로 채워진다) -->
    <path d="M 700 130
             C 740 130 760 150 760 190
             V 840
             C 760 880 740 900 700 900
             C 660 900 645 880 645 840
             V 190
             C 645 150 660 130 700 130
             Z" />
    <path d="M 700 425
             H 880
             C 920 425 940 445 940 475
             C 940 505 920 525 880 525
             H 700
             Z" />
  </g>
</svg>
